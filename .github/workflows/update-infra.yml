name: Update infra image tag

# Reusable deploy step. The calling project repo builds and pushes its own
# image, then calls this workflow to bump the tag in the infra manifests
# (Flux syncs the change to the cluster).
#
# Example caller:
#   deploy:
#     needs: build
#     if: github.ref == 'refs/heads/main'
#     uses: samuellando/actions/.github/workflows/update-infra.yml@main
#     with:
#       image: ghcr.io/samuellando/zelda-homepage
#       tag: sha-74eb511
#       infra_file: apps/homepage/kube_config.yml
#     secrets:
#       INFRA_PAT: ${{ secrets.INFRA_PAT }}

on:
  workflow_call:
    inputs:
      image:
        description: Full image name without tag (e.g. ghcr.io/samuellando/zelda-homepage)
        required: true
        type: string
      tag:
        description: Image tag the project built and pushed (e.g. sha-74eb511)
        required: true
        type: string
      infra_file:
        description: Manifest to bump in infra repo (e.g. apps/homepage/kube_config.yml)
        required: true
        type: string
      infra_repo:
        description: Infra repo to update (owner/repo)
        required: false
        default: samuellando/zelda-infra
        type: string
    secrets:
      INFRA_PAT:
        description: PAT with Contents RW on infra repo (GITHUB_TOKEN cannot push cross-repo)
        required: true

jobs:
  update-infra:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout infra repo
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.infra_repo }}
          token: ${{ secrets.INFRA_PAT }}
          path: infra

      - name: Update image tag in infra
        working-directory: infra
        env:
          IMAGE: ${{ inputs.image }}
          TAG: ${{ inputs.tag }}
          INFRA_FILE: ${{ inputs.infra_file }}
        run: |
          echo "Updating $INFRA_FILE to $IMAGE:$TAG"
          sed -i -E "s|${IMAGE}:[^[:space:]\"']+|${IMAGE}:${TAG}|g" "$INFRA_FILE"
          grep -n -F "$IMAGE:" "$INFRA_FILE"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$INFRA_FILE"
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update $(basename "$(dirname "$INFRA_FILE")") to $TAG"
            git push
          fi
