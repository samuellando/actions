name: Build and push image

# Reusable build step. The calling project repo checks out its own code
# (actions/checkout checks out the caller when run from a reusable workflow),
# builds its Docker image and pushes it to GHCR.
#
# Example caller:
#   jobs:
#     build:
#       uses: samuellando/actions/.github/workflows/build-push.yml@main
#       with:
#         image: ghcr.io/samuellando/readthis
#
# The caller must grant packages: write (token permissions come from the caller).

on:
  workflow_call:
    inputs:
      image:
        description: Full image name without tag (e.g. ghcr.io/samuellando/readthis)
        required: true
        type: string
      context:
        description: Docker build context
        required: false
        default: .
        type: string
    outputs:
      image_tag:
        description: Short-sha image tag that was pushed (e.g. sha-74eb511)
        value: ${{ jobs.build.outputs.image_tag }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute short tag
        id: tag
        run: |
          SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-7)
          echo "tag=sha-${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ inputs.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
